apiVersion: apps/v1
kind: Deployment
metadata:
  name: streaming-deployment
spec:
  replicas: {{ .Values.services.streaming.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: streaming }
  template:
    metadata:
      labels: { app: streaming }
    spec:
      containers:
        - name: streaming
          image: "{{ .Values.services.streaming.image }}:{{ .Values.services.streaming.tag }}"
          ports:
            - containerPort: {{ .Values.services.streaming.port }}
          envFrom:
            - configMapRef: { name: streamingapp-config }
            - secretRef: { name: streamingapp-secret }
          env:
            - name: PORT
              value: {{ .Values.services.streaming.port | quote }}
          resources:
{{ toYaml .Values.resources | indent 12 }}
          readinessProbe:
            tcpSocket: { port: {{ .Values.services.streaming.port }} }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: {{ .Values.services.streaming.port }} }
            initialDelaySeconds: 30
            periodSeconds: 20
