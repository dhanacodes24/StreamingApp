{{- $strip := .Values.ingress.stripPrefix }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: streamingapp-api
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "512m"
{{- if $strip }}
    nginx.ingress.kubernetes.io/rewrite-target: /$2
{{- end }}
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
{{- range $p := list
      (dict "name" "auth" "svc" "auth-svc" "port" .Values.services.auth.port)
      (dict "name" "streaming" "svc" "streaming-svc" "port" .Values.services.streaming.port)
      (dict "name" "admin" "svc" "admin-svc" "port" .Values.services.admin.port)
      (dict "name" "chat" "svc" "chat-svc" "port" .Values.services.chat.port) }}
          - path: /api/{{ $p.name }}{{ if $strip }}(/|$)(.*){{ end }}
            pathType: {{ if $strip }}ImplementationSpecific{{ else }}Prefix{{ end }}
            backend:
              service:
                name: {{ $p.svc }}
                port:
                  number: {{ $p.port }}
{{- end }}
